# AusLAMP Queensland Phase 3: the survey-level inputs. Everything the package needs that is not per site.
# Paths are read-only except work_root, which is the only place the package writes.
name: queensland_phase3
release: "University of Adelaide AusLAMP Queensland Phase 3, 2025-26 (unpublished; raw on E:)"
raw_root: "E:/MT_Timeseries_DATA/MT_AusLAMP_QLD/Phase 3/Rawdata from Earth Data Logger june july 2026"
work_root: E:/MT_Timeseries_DATA/MT_AusLAMP_QLD/Processing_WB/phase3

# The years the survey recorded. This is what the EDL GPS week-rollover test compares against: a file stamped
# before the first of these years is 1024 weeks (7168 days) early and is corrected. Every file of this phase
# is stamped 2006 and every one is corrected to 2026.
years: [2026]

# The 15 site folders sit directly under raw_root, so subdir is empty. A <site>.zip sits beside each of them
# holding the same day folders; the unzipped folder is the input and a file is never taken for a site.
instruments_layout:
  PR6-24+Mag-03:
    subdir: ""
    layout: edl_dayofyear          # <site>/<DDD>/<stem><YYMMDDhhmmss>.<BX BY BZ EX EY TP>
    sample_rate_hz: 10
    site_layout: edl_L             # north and east arms with a shared centre electrode
    exclude: []

raw_overrides: {}

# The instrument constants, with the source of each. They convert counts to field and are never guessed.
instruments:
  PR6-24+Mag-03:
    uv_per_count: 1.0
    h_uv_per_nt: 142.857
    bz_divider: 0.4
    e_gain: 10
    source: "mt_io.uoa.pr624 constants (BARTINGTON_UV_PER_NT, BZ_DIVIDER_RATIO, E_TERMINAL_BOX_GAIN,
      ADC_LOW_GAIN_FULL_SCALE_V)"
    logger_manufacturer: Earth Data Ltd
    logger_model: PR6-24
    sensor_manufacturer: Bartington
    sensor_model: Mag-03

# Products are processed and served in geomagnetic north: each site's horizontal magnetics are rotated so the
# mean Hy is zero, which removes the hand-compass misalignment. The IGRF declination is recorded in every file
# and NOT applied.
frame: geomagnetic
declination_source: "IGRF via ppigrf, at the site, at the record midpoint"

# The identity every product's header carries. survey_id is the EDI SURVEY id, project its name,
# geographic_name the region named beside each station, author the person the products are processed by.
survey_id: AusLAMP_QLD_P3
project: AusLAMP Queensland Phase 3
geographic_name: northern Queensland, Australia
author: Ben Kay
organization: AuScope and the University of Adelaide

observatory:
  archive: E:/MT_Timeseries_DATA/Geomagnetic_Observatory_Data/INTERMAGNET_1sec
  code: CTA                         # Charters Towers; the nearest one-second observatory to the Queensland sites

# No transfer function has been released for this phase.
release_tensors: {}

release_mth5: {}
instrument_register: ""

# Every dipole is on a deployment sheet, so no default is needed.
dipole_default: {}

# Ben's September 2026 processing of this same raw data, for the comparison in workbook 04 only (read-only).
earlier_processing:
  folder: E:/MT_Timeseries_DATA/MT_AusLAMP_QLD/processed_2026/phase3_v1
  frame: geomagnetic
  note: "Ben's September 2026 Aurora processing of Phase 3, single station and remote site, 1 Hz and 10 Hz;
    the same raw data through a different code path, rotated so each site's mean Hy is zero (processed_2026
    README, Site setup and the coordinate frame)"
  layout: "aurora/<kind>_<params>/<site>.edi"
  params: kaiser20_75
  kind_map: {single: single, remote: partner, obs: obs_cta, stack: stack, stack_obs: hybrid}

# Further comparison sources, each of the same shape as earlier_processing and each declaring its frame and
# its note.
comparisons:
  campaign_merged:
    folder: E:/MT_Timeseries_DATA/MT_AusLAMP_QLD/processed_2026/final_2026-09-09/merged_edi
    frame: geomagnetic
    note: "the September 2026 campaign's deliverable, one merged EDI per station (qld_merge_edis.py,
      2026-09-09): a 1 Hz long file, a middle piece below 100 s where a clean window beat the whole record,
      and a 10 Hz short end below 20 s aligned onto the long file by a local level and phase factor, on a
      common grid of ten periods a decade; it is one curve per site and not one per reference kind, and rows
      that are not products are blanked with the EDI 1e32 fill"
    layout: "<site>.edi"

# The deployment sheet position, compared in workbook 01 and never used as a value. The sheets were
# transcribed into phase3_master.csv on 2026-09-05, and Q54's degree-digit slip was corrected there, so the
# comparison shows Q54 agreeing and the slip is carried in that site's notes instead.
comparison_positions:
  table: D:/BEN/MTH5_Aurora_mt-io_2026/work/qld_phase3/phase3_master.csv
  columns: {site: site, lat: sheet_lat, lon: sheet_lon}
  select: {}
  label: "the Phase 3 deployment sheets, transcribed into phase3_master.csv sheet_lat/sheet_lon 2026-09-05"

# Per-site facts a check in a workbook tests against, each an input and not a computed value. Two sites open
# on an hour the logger wrote under the previous deployment's name; a discovery that globbed on the site name
# would drop those hours and start the record late.
checks:
  first_data_file:
    Q44: Q68N_061023025217
    Q55: Q57N_061024

floors:
  member_chunk_days: 0.5
  align_fallback_s: 43200
  min_window_days: 0.5
# The clean-pool thresholds of stage 3, each with its value. A site is fit to reference another when its
# H record carries few transients AND its baseline is normal: the event fraction catches a site that is fine
# except for a power-cycle, and the baseline catches one that never spikes because it is loud all the time.
# The scan walks the rotated record in chunk_s chunks and takes the median band power over band_hz.
pool:
  chunk_s: 600                 # the tail scan's chunk, in s
  nperseg: 512                 # the Welch segment inside a chunk, in samples at 1 Hz
  band_hz: [0.005, 0.05]       # 20-200 s: on a cache decimated from 10 Hz the 2-20 s band
                               # sits on the anti-alias roll-off and reads each unit's own
                               # noise floor, which spans five decades across a fleet
  own_ratio: 100               # a chunk is a candidate event above this multiple of the site's own median
  fleet_excess: 10             # ... and only where it also exceeds this multiple of the fleet's median
  min_fleet: 3                 # below this many other sites recording, the site's own threshold decides alone
  event_frac_max: 0.02         # clean: at most this fraction of chunks flagged
  baseline_max: 10             # clean: at most this multiple of the survey median baseline
  e_burst_ratio: 100           # an E burst: this multiple of the line's own median band power
  min_segment_s: 3600          # a kept stretch shorter than this yields no run and is dropped and counted

bands:
  liveness: ["10-30", "30-100", "100-1000", "300-3000"]
  splice_step_below: "8-16"
  splice_step_above: "32-100"
  splice_guard: "18-36"
  splice_join_s: 16
  splice_max_step_pct: 2.0
controls:
  best_hours_random_control: true
  zero_items_is_fail: true

# Site tables built by other code, for workbook 01 to regress its discovery against. They are a regression and
# not a source: nothing is read from them into sites.csv. qld_positions.csv carries all 56 sites of the three
# phases, so `select` keeps this phase's rows. The spans live in a second table, phase3_master.csv, whose
# first_sample_utc and last_sample_utc are the span that processing kept: a site whose leading days were
# dropped there differs from the raw first sample by exactly that trimming.
regression:
  sites: D:/BEN/MTH5_Aurora_mt-io_2026/work/qld_positions.csv
  dated: "2026-09-07 positions, 2026-09-05 spans"
  columns: {site: site, lat: latitude, lon: longitude}
  select: {phase: 3}
  times: D:/BEN/MTH5_Aurora_mt-io_2026/work/qld_phase3/phase3_master.csv
  time_columns: {site: site, start_utc: first_sample_utc, end_utc: last_sample_utc}
  time_select: {}
  # The spans in `times` are the hours the campaign's processing kept, not the raw first and last sample:
  # the head of each record loses its transit hours and a dead tail or a leading outage is cut. Declaring the
  # kind makes workbook 01 test containment -- the raw span must hold that window -- instead of equality.
  times_kind: processing_window
  position_tolerance_m: 20
  time_tolerance_h: 1
