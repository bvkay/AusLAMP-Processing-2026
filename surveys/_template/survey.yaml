# Survey-level inputs. Copy this folder to surveys/<name>/ and fill every field.
# Paths are read-only except work_root, which is the only place the package writes.
name: TEMPLATE
release: ""                 # who released the raw data, the eCat or DOI, and when
raw_root: ""                # the folder the release's site folders live under (read-only)
work_root: ""               # caches, stores, run trees and transfer functions (written here)

# The years the survey recorded, earliest first. The EDL GPS week-rollover test compares against these: a file
# stamped before the first of them is 1024 weeks (7168 days) early and is corrected. No file on disk holds the
# true date, so this list is an input and not something the package can infer.
years: []

# One block per instrument in the survey.
instruments_layout:
  PR6-24+Mag-03:
    subdir: ""              # the folder under raw_root holding this instrument's site folders; "" = raw_root
    layout: edl_dayofyear   # edl_dayofyear | lemi_data_nnnn | lemi_zip
    sample_rate_hz: 10      # read from the files and checked against this
    site_layout: edl_L      # edl_L (north and east arms with a shared centre) | lemi_cross
    exclude: []             # folders beside the sites that are not sites (KML, docs)
  LEMI-424:
    subdir: ""
    layout: lemi_data_nnnn
    sample_rate_hz: 1
    site_layout: lemi_cross
    exclude: []

# A site whose raw folder is not <raw_root>/<subdir>/<site> -- a split deployment, a re-cut tree.
raw_overrides: {}

# The instrument constants that convert counts to field, each with its source. Never guessed.
instruments:
  PR6-24+Mag-03:
    uv_per_count: 1.0
    h_uv_per_nt: 142.857
    bz_divider: 0.4
    e_gain: 10
    source: "mt_io.uoa.pr624 constants"
    logger_manufacturer: Earth Data Ltd
    logger_model: PR6-24
    sensor_manufacturer: Bartington
    sensor_model: Mag-03
  LEMI-424:
    e_units: uV/m
    source: "the logger divides E by the %L lengths before writing: never divide by L again"
    logger_manufacturer: LEMI LLC
    logger_model: LEMI-424
    sensor_manufacturer: LEMI LLC
    sensor_model: LEMI-424

# A transfer function is estimated and served in geomagnetic north (the horizontal magnetics rotated so the
# mean Hy is zero). The IGRF declination is recorded in every file and not applied.
frame: geomagnetic
declination_source: "IGRF via ppigrf, at the site, at the record midpoint"

# The identity every transfer function's header carries. survey_id is the EDI SURVEY id, project its name,
# geographic_name the region named beside each station, author the person who processed them. No workbook
# measures any of these five: `decide` here means the student writes them, and whatever is left at `decide`
# goes into every delivered EDI header as the word `decide`.
survey_id: decide
project: decide
geographic_name: decide
author: decide
organization: decide

observatory:
  # `archive` is a path on THIS machine, like raw_root and work_root, and the value below is the one this
  # repository was written on. Point it at the INTERMAGNET one-second archive on yours: one parquet per
  # observatory-year, <CODE>_1sec_<year>.parquet. A machine with no archive at all keeps the path and runs
  # workbook 01 with FETCH = True, which downloads the days the span needs from the INTERMAGNET GIN into
  # it, one request per day.
  archive: E:/MT_Timeseries_DATA/Geomagnetic_Observatory_Data/INTERMAGNET_1sec
  # The IAGA code of the observatory this survey references, `decide` until it is chosen. Workbook 01 reads
  # the archive's coverage over the survey's span for every observatory in auslamp_proc.geo.OBSERVATORIES,
  # prints them nearest first and names the one to write here; it refuses to go on with `decide`, because
  # `decide` is not an IAGA code and asking the archive for one finds nothing.
  code: decide

release_mth5: {}            # instrument: folder of the release's own MTH5 files (compared, never used)
instrument_register: ""     # a CSV of logger serials against sites, if the release ships one

# A position from outside the instrument -- a deployment sheet, a site metadata table. Workbook 01 compares it
# against the position the instrument's own GPS recorded and never reads a value from it.
comparison_positions: {}
# comparison_positions:
#   table: ""
#   columns: {site: site, lat: sheet_lat, lon: sheet_lon}
#   select: {}              # rows of that table to keep, as column: value
#   label: ""               # what the table is, printed above the comparison

# Per-site facts a check in a workbook tests against. Each entry is an input, not a computed value. The
# three keys the workbooks read are first_data_file, retained_failures and recipe_window, and each is
# scored only at the sites it names: a survey that names none is not scored on it and the cell says so.
checks: {}
# checks:
#   first_data_file: {}     # workbook 01. site: the name its first data file must start with, where the
#                           # logger wrote that hour under a previous deployment's name; the discovery must
#                           # read headers and not glob on the site name
#   retained_failures:      # every workbook, through tests/test_conventions.py. A verdict a run reports
#                           # honestly over a condition the survey itself carries, and which the package
#                           # does not repair. A FAIL is excused only where an entry names both the
#                           # workbook and a site the verdict's own text names, so a new failure cannot
#                           # shelter behind an old entry; a survey-wide verdict that names no site cannot
#                           # be retained this way and is reported as it stands
#     - workbook: 02_records
#       site: Q00
#       reason: "what the survey carries, and why the package does not repair it"
#   recipe_window:          # workbook 04. The hours a campaign chose by hand for a site, for the selection
#                           # rule to be scored against; tolerance_h is how far each end may differ
#     tolerance_h: 1
#     Q00: {t_start: "2026-03-22T12:00:00", t_end: "2026-03-23T02:00:00", source: "who chose it and when"}

# The arm lengths in metres. A LEMI writes them into its .INF and a release MTH5 may carry them, but an EDL
# raw folder records none at all: they are on the deployment sheet. So a survey names the CSV the sheet was
# transcribed into, or one default with the reason it is used, or both -- the table where it has a row for
# the site and the default, written assume:<metres>, where it does not. Apparent resistivity goes as the
# square of the length, so a length nobody recorded is an assumption and is carried as one into the
# provenance of every transfer function the site delivers.
dipoles: {}
# dipoles:
#   table: dipoles.csv      # a path relative to this survey folder, or an absolute one. Columns: site,
#                           # dipole_n_m, dipole_e_m, source. The expected source is the deployment sheet,
#                           # transcribed with its date, and the `source` cell says so per site
#   columns: {}             # {our name: their name} where the CSV spells a column differently
#   default_m: 100          # metres, used at a site the table has no row for
#   reason: "why that default is used, in full; it is carried into every transfer function's provenance"
#
# `dipole_default` is the older per-instrument spelling of the same default and is still read:
# dipole_default:
#   PR6-24+Mag-03: {value: 100, reason: "why that default is used, in full"}
dipole_default: {}

floors:
  member_chunk_days: 0.5
  align_fallback_s: 43200
  min_window_days: 0.5
# The clean-pool thresholds of stage 3, each with its value. A site is fit to reference another when its
# H record carries few transients AND its baseline is normal: the event fraction catches a site that is fine
# except for a power-cycle, and the baseline catches one that never spikes because it is loud all the time.
# The scan walks the rotated record in chunk_s chunks and takes the median band power over band_hz.
pool:
  chunk_s: 600                 # the tail scan's chunk, in s
  nperseg: 512                 # the Welch segment inside a chunk, in samples at 1 Hz
  band_hz: [0.005, 0.05]       # 20-200 s: on a cache decimated from 10 Hz the 2-20 s band
                               # sits on the anti-alias roll-off and reads each unit's own
                               # noise floor, which spans five decades across a fleet
  own_ratio: 100               # a chunk is a candidate event above this multiple of the site's own median
  fleet_excess: 10             # ... and only where it also exceeds this multiple of the fleet's median
  min_fleet: 3                 # the event test is fleet-normalised, so it needs this many other sites
                               # with a scan to ask: a chunk recorded while fewer than this many
                               # others were running carries no corroboration and is flagged, and a
                               # run scoped to fewer than this many sites in all turns the event
                               # limb OFF and judges the pool on its baseline alone
  event_frac_max: 0.02         # clean: at most this fraction of chunks flagged
  baseline_max: 10             # clean: at most this multiple of the survey median baseline
  e_burst_ratio: 100           # an E burst: this multiple of the line's own median band power
  min_segment_s: 3600          # a kept stretch shorter than this yields no run and is dropped and counted

bands:
  liveness: ["10-30", "30-100", "100-1000", "300-3000"]
  splice_step_below: "8-16"
  splice_step_above: "32-100"
  splice_guard: "18-36"
  splice_join_s: 16
  splice_max_step_pct: 2.0
controls:
  best_hours_random_control: true     # every best-hours claim carries a random selection of the same size
  zero_items_is_fail: true            # a check that scores zero items FAILS (UNJUDGED)

# A site table built by other code, for workbook 01 to regress its discovery against. It is a regression and
# not a source: nothing is read from it into sites.csv. Leave the block out if there is none.
regression: {}
